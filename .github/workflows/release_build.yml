name: Build and Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  executable: PoBoy

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            artifact: linux
            extension:

          - os: macos-26
            artifact: macos
            extension:

          - os: windows-latest
            artifact: windows
            extension: .exe

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install SDL3 Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Configure LLVM Clang
        if: runner.os == 'macOS'
        run: |
          brew install lld@20
          echo "$(brew --prefix llvm@20)/bin" >> $GITHUB_PATH
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Build
        run: python3 dmg_build.py -m release ${{ env.executable }}

      - name: Package
        run: |
          mkdir artifacts
          cp build/local/bin/${{ env.executable }}${{ matrix.extension }} artifacts/${{ env.executable }}-${{ matrix.artifact }}${{ matrix.extension }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*

  release:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v6

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          make_latest: false
          files: |
            **/*